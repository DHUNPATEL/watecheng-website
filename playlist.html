<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhun's Playlist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    .icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ff0000, #cc0000);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #ff0000;
      color: #fff;
      text-decoration: none;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.15s;
    }

    .play-btn:hover {
      background: #cc0000;
      transform: scale(1.04);
    }

    .play-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎵</div>
    <h1>Dhun's Playlist</h1>
    <p class="subtitle">A handpicked collection of my favourite tracks — open in YouTube Music to listen.</p>
    <a class="play-btn" href="https://music.youtube.com/playlist?list=PLrhZUD-UUDf-5XQ0O3hVcJmGj2d9qNi6Y&si=19fihdelDI89HjU2" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      Open Playlist
    </a>
    <p class="footer-note">Opens in YouTube Music</p>
  </div>
</body>
</html>
